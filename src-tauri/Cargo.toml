[package]
name = "oneopen"
version = "0.1.0"
description = "A lightweight universal desktop file workspace"
authors = ["OneOpen contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "oneopen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
infer = "0.19"
mime_guess = "2"
encoding_rs = "0.8"
chardetng = "0.1"
zip = { version = "4", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
dashmap = "6"
tempfile = "3"
atomicwrites = "0.4"
open = "5"
base64 = "0.22"
calamine = { version = "0.36", default-features = false }
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "qoi", "pnm", "rayon"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
tiny-skia = "0.11"

[dev-dependencies]
assert_fs = "1"
filetime = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
